packages:
  - '.'

nodeLinker: hoisted
strictPeerDependencies: false

overrides:
  '@types/react': '19.0.12'
  lodash: ^4.17.23
  postcss@<8.5.10: ^8.5.10
  tmp: ^0.2.6
  uuid@<11.1.1: ^11.1.1

allowBuilds:
